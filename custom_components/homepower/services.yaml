pause:
  name: Pause control
  description: Stop HomePower sending any commands (it keeps reading).
resume:
  name: Resume control
  description: Resume normal scheduling.
override:
  name: Manual override
  description: Force a mode on some or all batteries for a while, taking priority over schedules.
  fields:
    mode:
      name: Mode
      required: true
      selector:
        select:
          options: [auto, charge, discharge, hold]
    power_w:
      name: Power (W)
      selector:
        number: {min: 0, max: 50000, unit_of_measurement: W}
    target_soc:
      name: Stop charging at SOC (%)
      selector:
        number: {min: 0, max: 100, unit_of_measurement: "%"}
    minutes:
      name: Duration (minutes)
      default: 60
      selector:
        number: {min: 1, max: 1440, unit_of_measurement: min}
    device_ids:
      name: Battery IDs (empty = all)
      selector:
        object:
clear_override:
  name: Clear manual override
  description: Go back to schedules.
  fields:
    device_ids:
      name: Battery IDs (empty = all)
      selector:
        object:
backup:
  name: Backup mode
  description: Keep a reserve for power cuts (top up to the backup reserve and never discharge below it).
  fields:
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:
away:
  name: Away mode
  description: Use only schedules marked for "away" while you are out.
  fields:
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:
test_control:
  name: Test control
  description: Send a tiny safe command to a battery, check it follows, then hand it back.
  fields:
    device_id:
      name: Battery ID
      required: true
      selector:
        text:
apply_scene:
  name: Apply scene
  description: "Switch to a saved scene (Holiday, Storm coming, ...) - its backup, away and pause settings and any limits it sets."
  fields:
    name:
      name: Scene
      required: true
      selector:
        text:
